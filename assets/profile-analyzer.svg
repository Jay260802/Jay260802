<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-labelledby="title desc">
  <title id="title">Profile README analyzer</title>
  <desc id="desc">A local checklist checking image links, alt text, section structure, remote dependencies, and credential-shaped strings.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10182c"/><stop offset="1" stop-color="#182448"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#39d0c8"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="12" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="8" y="8" width="1184" height="274" rx="22" fill="url(#bg)" stroke="#34415f" stroke-width="2"/>
  <circle cx="1070" cy="70" r="110" fill="#6558ff" opacity=".13" filter="url(#glow)"/>
  <text x="48" y="59" fill="#70e4dd" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="4">LOCAL PROFILE CHECK</text>
  <text x="48" y="106" fill="#f1f5ff" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="700">A quick health check for the README</text>
  <text x="48" y="137" fill="#aab7d2" font-family="Segoe UI,Arial,sans-serif" font-size="16">Checklist output · no score · runs locally</text>
  <g font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">
    <g transform="translate(48 171)"><rect width="205" height="66" rx="13" fill="#17233a" stroke="#354665"/><circle cx="28" cy="33" r="12" fill="#163d3a"/><path d="m22 33 4 4 8-9" fill="none" stroke="#55e1bf" stroke-width="2.5"/><text x="51" y="38" fill="#dce6f9">Image links</text></g>
    <g transform="translate(269 171)"><rect width="205" height="66" rx="13" fill="#17233a" stroke="#354665"/><circle cx="28" cy="33" r="12" fill="#163d3a"/><path d="m22 33 4 4 8-9" fill="none" stroke="#55e1bf" stroke-width="2.5"/><text x="51" y="38" fill="#dce6f9">Alt text</text></g>
    <g transform="translate(490 171)"><rect width="205" height="66" rx="13" fill="#17233a" stroke="#354665"/><circle cx="28" cy="33" r="12" fill="#163d3a"/><path d="m22 33 4 4 8-9" fill="none" stroke="#55e1bf" stroke-width="2.5"/><text x="51" y="38" fill="#dce6f9">Section outline</text></g>
    <g transform="translate(711 171)"><rect width="205" height="66" rx="13" fill="#17233a" stroke="#354665"/><circle cx="28" cy="33" r="12" fill="#163d3a"/><path d="m22 33 4 4 8-9" fill="none" stroke="#55e1bf" stroke-width="2.5"/><text x="51" y="38" fill="#dce6f9">Remote images</text></g>
    <g transform="translate(932 171)"><rect width="220" height="66" rx="13" fill="#17233a" stroke="#354665"/><circle cx="28" cy="33" r="12" fill="#163d3a"/><path d="m22 33 4 4 8-9" fill="none" stroke="#55e1bf" stroke-width="2.5"/><text x="51" y="38" fill="#dce6f9">Secret patterns</text></g>
  </g>
  <rect x="48" y="257" width="1104" height="3" rx="2" fill="url(#accent)" opacity=".8"/>
