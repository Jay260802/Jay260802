<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Automated Histologic Subtyping of Renal Cell Carcinoma</title>
  <desc id="desc">Computational pathology study with four subtype classes and reported research metrics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101222"/><stop offset=".55" stop-color="#251A3C"/><stop offset="1" stop-color="#3A1744"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#C4B5FD"/><stop offset="1" stop-color="#F0ABFC"/></linearGradient>
    <radialGradient id="cell"><stop stop-color="#F5D0FE"/><stop offset=".36" stop-color="#C084FC"/><stop offset="1" stop-color="#5B21B6"/></radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#D8B4FE" stroke-opacity=".06"/></pattern>
  </defs>
  <rect width="1200" height="330" rx="22" fill="url(#bg)"/><rect width="1200" height="330" rx="22" fill="url(#grid)"/>
  <g opacity=".95" stroke="#F5D0FE" stroke-opacity=".55" stroke-width="1.5">
    <path d="M46 48q35-28 66 3t61-5 58 7 59-8 60 12M40 97q31-24 58 5t61-4 61 10 61-12 57 9M46 148q35-26 63 3t58-5 62 8 59-10 58 8M40 204q31-24 60 6t60-3 60 8 60-11 64 8M44 260q33-25 62 3t61-6 59 8 61-10 58 7" fill="none"/>
    <circle cx="78" cy="73" r="17" fill="url(#cell)"/><circle cx="152" cy="58" r="12" fill="url(#cell)"/><circle cx="221" cy="94" r="20" fill="url(#cell)"/><circle cx="286" cy="66" r="14" fill="url(#cell)"/><circle cx="102" cy="132" r="23" fill="url(#cell)"/><circle cx="176" cy="157" r="15" fill="url(#cell)"/><circle cx="261" cy="144" r="24" fill="url(#cell)"/><circle cx="66" cy="213" r="14" fill="url(#cell)"/><circle cx="144" cy="228" r="24" fill="url(#cell)"/><circle cx="225" cy="203" r="17" fill="url(#cell)"/><circle cx="294" cy="244" r="23" fill="url(#cell)"/><circle cx="82" cy="278" r="18" fill="url(#cell)"/><circle cx="199" cy="278" r="13" fill="url(#cell)"/>
