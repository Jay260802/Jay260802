  <rect x="359" y="31" width="2" height="268" fill="url(#edge)" opacity=".7"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">
    <text x="399" y="63" fill="#E9D5FF" font-size="14" letter-spacing="4">RESEARCH  /  COMPUTATIONAL PATHOLOGY</text>
    <text x="397" y="121" fill="#F8FAFC" font-size="32" font-weight="700" letter-spacing=".3">AUTOMATED HISTOLOGIC SUBTYPING</text>
    <text x="399" y="163" fill="#F8FAFC" font-size="28" font-weight="600">RENAL CELL CARCINOMA</text>
    <text x="399" y="198" fill="#C4B5FD" font-size="16">Four subtype classes  ·  563 whole-slide images</text>
    <rect x="399" y="225" width="220" height="61" rx="10" fill="#171A2D" stroke="#A78BFA" stroke-opacity=".5"/>
    <rect x="632" y="225" width="220" height="61" rx="10" fill="#171A2D" stroke="#A78BFA" stroke-opacity=".5"/>
    <rect x="865" y="225" width="289" height="61" rx="10" fill="#171A2D" stroke="#A78BFA" stroke-opacity=".5"/>
    <text x="418" y="250" fill="#A5B4FC" font-size="11" letter-spacing="1.5">TEST ACCURACY</text>
    <text x="418" y="275" fill="#F8FAFC" font-size="21" font-weight="700">93.38%</text>
    <text x="651" y="250" fill="#A5B4FC" font-size="11" letter-spacing="1.5">VALIDATION</text>
    <text x="651" y="275" fill="#F8FAFC" font-size="21" font-weight="700">93.93%</text>
    <text x="884" y="250" fill="#A5B4FC" font-size="11" letter-spacing="1.5">ROC–AUC ACROSS SUBTYPES</text>
